<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Form</title>
  <link rel="stylesheet" href="/Users/prestonneufeld/Full Stack Dev Class/Questionaire/questionaire.css">
</head>

<body>
  <form id="myForm">


    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>
    <br><br>

    <label for="class">Class:</label>
    <select id="class" name="class" required>
      <option value="">Select a class</option>
      <option value="freshman">Freshman</option>
      <option value="sophomore">Sophomore</option>
      <option value="junior">Junior</option>
      <option value="senior">Senior</option>
    </select>
    <br><br>

    <p>Are you a student?</p>

    <input type="radio" id="yes" name="student" value="yes" required>
    <label for="yes">Yes</label>

    <input type="radio" id="no" name="student" value="no">
    <label for="no">No</label>
    <br><br>

    <p>Select your interests:</p>

    <input type="checkbox" id="sports" name="interests" value="sports">
    <label for="sports">Sports</label>

    <input type="checkbox" id="music" name="interests" value="music">
    <label for="music">Music</label>

    <input type="checkbox" id="games" name="interests" value="games">
    <label for="games">Games</label>
    <br><br>

    <label for="comments">Comments:</label>
    <br>
    <textarea id="comments" name="comments" rows="4" cols="30" required></textarea>
    <br><br>

    <input type="submit" value="Submit">

  </form>

  <script>
    document.getElementById("myForm").addEventListener("submit", function (event) {
      event.preventDefault();

      alert("Your form has been submitted successfully!");
    });
  </script>

</body>

</html>
