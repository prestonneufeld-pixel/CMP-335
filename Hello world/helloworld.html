<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <link rel="stylesheet" href="../helloworld.css">
  </head>

  <body>
    <main class="hello-world">
      <h1>Hello!</h1>

      <label for="fname">What's your name?</label>
      <input type="text" id="fname" name="fname" placeholder="Enter your name">
      <button type="button" onclick="myFunction()">Press me</button>
      <p id="greeting" aria-live="polite"></p>
    </main>

    <script>
      function myFunction() {
        const newName = document.getElementById("fname").value.trim();
        const greeting = document.getElementById("greeting");

        greeting.textContent = newName ? `Hello ${newName}!` : "Hello!";
      }
    </script>
  </body>
</html>
