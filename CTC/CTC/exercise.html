<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 3 Exercise - Javascript Sampling</title>

    <link rel="stylesheet" href="exercise.css">
    <script src="exercise.js"></script>
</head>

<body>
    <h1>Central Tendency Calculator</h1>

    <div>
        <label for="minimum">Minimum:</label>
        <input type="number" id="minimum" name="minimum" required>
        <label for="maximum">Maximum:</label>
        <input type="number" id="maximum" name="maximum" required>
    </div>
    <form>
        <label for="NumberCalc">Enter a number:</label>
        <input type="text" id="NumberCalc" name="NumberCalc">
        <button type="submit" onclick="return addNumberToList1(event)">Submit number</button>
    </form>

    <div class="myflexboxColumn">
        <h2>List 1</h2>
        <table id="myList1">
        </table>
        <br /> <br />
        <input type="button" value="Clear the list" onclick="clearList1()">
    </div>
    <div>
        <p>Mean: <span id="mean">-</span></p>
        <p>Median: <span id="median">-</span></p>
        <p>Mode: <span id="mode">-</span></p>
    </div>
    </div>
</body>

</html>
